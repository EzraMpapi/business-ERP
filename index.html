<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BusinessSphere ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet" />
    <style>
      #splash { position:fixed;inset:0;background:#111827;display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s; }
      #splash.out { opacity:0;pointer-events:none; }
      .splash-logo { width:56px;height:56px;background:#16A34A;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:system-ui;font-size:26px;font-weight:900;color:#fff;animation:pulse 1.5s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{transform:scale(1)}50%{transform:scale(1.08)} }
    </style>
  </head>
  <body>
    <div id="splash"><div class="splash-logo">B</div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.__bsHide=function(){var e=document.getElementById("splash");if(e){e.classList.add("out");setTimeout(function(){e.remove()},400)}};
      setTimeout(function(){if(document.getElementById("splash"))window.__bsHide()},8000);
    </script>
  </body>
</html>
